name: Release version

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: |
          version="$(grep -oE 'BROWSER · v[0-9]+\.[0-9]+(\.[0-9]+)?' index.html | head -n1 | awk '{print $3}')"
          if [ -z "$version" ]; then
            echo "Version marker not found" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Create or explicitly republish this version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            # Only the explicitly requested v4.54.5 correction may update its
            # existing tag. Ordinary pushes never move a published tag.
            subject="$(git log -1 --format=%s)"
            if [ "$VERSION" != "v4.54.5" ] || ! grep -Fq '[republish:v4.54.5]' <<<"$subject"; then
              echo "$VERSION already exists; skipping."
              exit 0
            fi
            current_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION" --jq '.object.sha')"
            if [ "$current_sha" != "768946d0e2323638c2dd11a6f99e397a7d7109a7" ] && [ "$current_sha" != "$GITHUB_SHA" ]; then
              echo "Release tag unexpectedly changed; refusing to overwrite it." >&2
              exit 1
            fi
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$VERSION" -f "sha=$GITHUB_SHA" -F force=true
            gh release edit "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --notes-file RELEASE_NOTES.md
            echo "$VERSION tag and release updated to $GITHUB_SHA"
            exit 0
          fi
          if [ -f RELEASE_NOTES.md ]; then
            gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --notes-file RELEASE_NOTES.md
          else
            gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --generate-notes
          fi

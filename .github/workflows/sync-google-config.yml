name: Sync Google OAuth config

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

env:
  GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}

concurrency:
  group: sync-google-oauth-config
  cancel-in-progress: false

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Generate public Google OAuth config
        shell: bash
        run: |
          set -euo pipefail
          python tools/sync-google-config.py

      - name: Commit generated config when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- google-config.js index.html; then
            echo "google-config.js is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add google-config.js index.html
          git commit -m "chore: sync Google OAuth client config and cache key"
          git push origin HEAD:main

      - name: Request Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" >/dev/null
          echo "Requested GitHub Pages rebuild."
